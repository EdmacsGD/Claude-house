<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eefc">
<title>Claude House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Studio intro. Removed by app.js after ~2s. -->
<div id="splash" class="splash">
  <div class="splash-inner">
    <div class="splash-mark">BIRD</div>
    <p class="splash-line">Made by Bird Productions</p>
  </div>
</div>

<!-- role=alert already announces changes; #app must NOT be a live region,
     or every re-render would read the whole page to a screen reader. -->
<div id="banner" class="banner" role="alert" hidden></div>

<main id="app" class="app"></main>

<script type="module" src="app.js"></script>
</body>
</html>
